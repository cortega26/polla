[project]
name = "polla-scraper"
dynamic = ["version"]
description = "Alternative-source ingestion for Chilean Loto draws"
authors = [{name = "Carlos Ortega"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "click>=8.1.7",
    "requests>=2.33.1",
    "gspread>=6.1.0",
    "scrapling[fetchers]>=0.4.14,<0.5",
    "playwright>=1.61.0,<1.62",
]

[project.scripts]
polla = "polla_app.__main__:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polla_app*"]

[tool.setuptools.dynamic]
version = { attr = "polla_app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not network\""
markers = [
    "network: tests that hit live third-party sites (opt-in with -m network)",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.coverage.run]
source = ["polla_app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
