name: Ingest Alternative Sources

permissions:
  contents: read
  id-token: write

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publishing to Google Sheets'
        required: false
        default: 'false'
      force_publish:
        description: 'Force publish even if sorteo/fecha and amounts are unchanged'
        required: false
        default: 'false'
  repository_dispatch:
    types: [refresh-alt-sources]
  push:
    branches: [main]
    paths:
      - 'polla_app/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/scrape.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting & linting
        run: |
          black --check polla_app tests
          ruff check polla_app tests

      - name: Run type checking
        run: mypy polla_app

      - name: Run tests
        run: pytest tests -v --cov=polla_app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false


  ingest:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'push') }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Restore pipeline state
        id: restore-state
        uses: actions/cache/restore@v5
        with:
          path: pipeline_state
          key: pipeline-state-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            pipeline-state-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          python -m playwright install chromium --with-deps || python -m playwright install chromium

      - name: Run alternative-source pipeline (Loto pozos)
        id: pipeline
        env:
          ALT_SOURCE_URLS: ${{ vars.ALT_SOURCE_URLS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          mkdir -p artifacts raw pipeline_state logs
          FORCE_PUBLISH="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish || 'false' }}"
          if [ "${FORCE_PUBLISH}" = "true" ]; then FORCE_FLAG="--force-publish"; else FORCE_FLAG=""; fi
          python -m polla_app run \
            --sources pozos \
            --retries 3 \
            --timeout 30 \
            --no-fail-fast \
            --raw-dir artifacts/raw \
            --normalized artifacts/normalized.jsonl \
            --comparison-report artifacts/comparison_report.json \
            --summary artifacts/run_summary.json \
            --state-file pipeline_state/last_run.jsonl \
            --log-file logs/run.jsonl \
            --mismatch-threshold 0.2 \
            ${FORCE_FLAG}

      - name: Run Kino pipeline (Lotería de Concepción)
        id: pipeline-kino
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          mkdir -p artifacts_kino raw pipeline_state logs
          python -m polla_app run \
            --sources kino \
            --retries 3 \
            --timeout 30 \
            --no-fail-fast \
            --raw-dir artifacts_kino/raw \
            --normalized artifacts_kino/normalized.jsonl \
            --comparison-report artifacts_kino/comparison_report.json \
            --summary artifacts_kino/run_summary.json \
            --state-file pipeline_state/last_run_kino.jsonl \
            --log-file logs/run_kino.jsonl \
            --mismatch-threshold 0.2

      - name: Notify Slack on Kino failure
        if: ${{ steps.pipeline-kino.outcome == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get('SLACK_WEBHOOK_URL')
          if not webhook:
              raise SystemExit(0)
          payload = {
              "text": f"Kino ingest failed for run {os.environ.get('GITHUB_RUN_ID')} — "
                      "Loto pipeline continuó; revisar logs/run_kino.jsonl"
          }
          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
          )
          urllib.request.urlopen(req)
          PY

      - name: Parse publish decision
        id: decision
        run: |
          python - <<'PY'
          """Expose publish decision metadata for downstream jobs."""

          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary_path = Path("artifacts/run_summary.json")
          if not summary_path.exists():
              raise SystemExit("Run summary not found; cannot determine publish decision")

          payload = json.loads(summary_path.read_text(encoding="utf-8"))
          publish_flag = bool(payload.get("publish"))
          decision = payload.get("decision", {}) or {}
          status = str(decision.get("status", "unknown"))
          reason = str(payload.get("publish_reason") or decision.get("reason") or "unknown")

          outputs_path = Path(os.environ["GITHUB_OUTPUT"])
          with outputs_path.open("a", encoding="utf-8") as handle:
              handle.write(f"publish={'true' if publish_flag else 'false'}\n")
              handle.write(f"publish_reason={reason}\n")
              handle.write(f"decision_status={status}\n")

          summary_output = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_output:
              with Path(summary_output).open("a", encoding="utf-8") as handle:
                  handle.write("### Publish decision\n")
                  handle.write(f"- Publish: {'yes' if publish_flag else 'no'}\n")
                  handle.write(f"- Status: {status}\n")
                  handle.write(f"- Reason: {reason}\n")

          if not publish_flag:
              print(f"::notice::Publish job will be skipped because {reason} (status={status}).")
          PY

      - name: Parse Kino publish decision
        id: decision-kino
        run: |
          python - <<'PY'
          """Expose Kino publish decision metadata for downstream jobs."""

          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          summary_path = Path("artifacts_kino/run_summary.json")
          publish_flag = False
          reason = "kino_ingest_failed_or_missing"
          status = "unknown"
          if summary_path.exists():
              payload = json.loads(summary_path.read_text(encoding="utf-8"))
              publish_flag = bool(payload.get("publish"))
              decision = payload.get("decision", {}) or {}
              status = str(decision.get("status", "unknown"))
              reason = str(payload.get("publish_reason") or decision.get("reason") or "unknown")

          outputs_path = Path(os.environ["GITHUB_OUTPUT"])
          with outputs_path.open("a", encoding="utf-8") as handle:
              handle.write(f"publish_kino={'true' if publish_flag else 'false'}\n")
              handle.write(f"publish_kino_reason={reason}\n")

          if not publish_flag:
              print(f"::notice::Kino publish skipped because {reason} (status={status}).")
          PY

      - name: Save pipeline state
        uses: actions/cache/save@v5
        if: always()
        with:
          path: pipeline_state
          key: pipeline-state-${{ github.ref_name }}-${{ github.run_number }}

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alt-sources-artifacts
          path: |
            artifacts/
            artifacts_kino/
            logs/
          retention-days: 30

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get('SLACK_WEBHOOK_URL')
          if not webhook:
              raise SystemExit(0)
          payload = {
              "text": f"Alt-sources ingestion failed for run {os.environ.get('GITHUB_RUN_ID')}"
          }
          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
          )
          urllib.request.urlopen(req)
          PY

    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      publish_kino: ${{ steps.decision-kino.outputs.publish_kino }}

  publish:
    needs: ingest
    if: needs.ingest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish decision summary
        if: ${{ needs.ingest.outputs.publish != 'true' }}
        run: |
          echo "Publish step skipped: ${{ needs.ingest.outputs.publish_reason || 'no reason provided' }} (status=${{ needs.ingest.outputs.decision_status || 'unknown' }})"
          exit 0

      - uses: actions/checkout@v6
        if: ${{ needs.ingest.outputs.publish == 'true' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        if: ${{ needs.ingest.outputs.publish == 'true' }}
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        if: ${{ needs.ingest.outputs.publish == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Download artifacts
        if: ${{ needs.ingest.outputs.publish == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: alt-sources-artifacts

      - name: Publish to Google Sheets
        if: ${{ needs.ingest.outputs.publish == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}"
          # Fallbacks for legacy secret names
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ] && [ -n "${GOOGLE_CREDENTIALS}" ]; then
            export GOOGLE_SERVICE_ACCOUNT_JSON="${GOOGLE_CREDENTIALS}";
          fi
          if [ -z "${GOOGLE_SPREADSHEET_ID}" ]; then
            echo "::warning::GOOGLE_SPREADSHEET_ID secret not configured; skipping publish."
            exit 0
          fi
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ] || [ -z "${GOOGLE_SPREADSHEET_ID}" ]; then
            echo "Missing Google secrets; skipping publish.";
            exit 0;
          fi
          if [ "${DRY_RUN}" = "true" ]; then DRY_FLAG="--dry-run"; else DRY_FLAG="--no-dry-run"; fi
          python -m polla_app publish \
            --normalized artifacts/normalized.jsonl \
            --comparison-report artifacts/comparison_report.json \
            --summary artifacts/run_summary.json \
            --worksheet "Proximo Pozo" \
            --discrepancy-tab "Discrepancies" \
            ${DRY_FLAG}

      - name: Publish Kino to Google Sheets
        if: ${{ needs.ingest.outputs.publish_kino == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}"
          if [ -z "${GOOGLE_SPREADSHEET_ID}" ] || [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing Google secrets; skipping Kino publish.";
            exit 0;
          fi
          if [ ! -s artifacts_kino/normalized.jsonl ]; then
            echo "::warning::Kino normalized data missing; skipping Kino publish.";
            exit 0;
          fi
          if [ "${DRY_RUN}" = "true" ]; then DRY_FLAG="--dry-run"; else DRY_FLAG="--no-dry-run"; fi
          python -m polla_app publish \
            --normalized artifacts_kino/normalized.jsonl \
            --comparison-report artifacts_kino/comparison_report.json \
            --summary artifacts_kino/run_summary.json \
            --worksheet "Kino" \
            --discrepancy-tab "Discrepancias Kino" \
            ${DRY_FLAG}

