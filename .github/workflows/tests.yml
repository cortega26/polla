name: tests

on:
  push:
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check formatting & linting
        run: |
          black --check polla_app tests
          ruff check polla_app tests
      - name: Scan tracked files for credentials
        run: |
          matches=$(git ls-files | grep -iE 'service_account|(^\.env$)|credentials.*\.json' || true)
          if [ -n "$matches" ]; then
            echo "::error::Credential-shaped files are tracked:"; echo "$matches"
            exit 1
          fi

      - name: Mypy
        run: mypy polla_app tests
      - name: Pytest
        run: pytest tests -v --cov=polla_app --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false

