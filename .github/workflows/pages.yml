name: Publicar sitio

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 14 * * *'  # daily 14:00 UTC (after the 13:00 ingest)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps || python -m playwright install chromium

      - name: Ingest Loto pozos (dry data for the dashboard)
        id: ingest-loto
        continue-on-error: true
        run: |
          mkdir -p artifacts site
          python -m polla_app run \
            --sources pozos \
            --retries 2 \
            --timeout 30 \
            --no-fail-fast \
            --raw-dir artifacts/raw \
            --normalized artifacts/normalized.jsonl \
            --comparison-report artifacts/comparison_report.json \
            --summary artifacts/run_summary.json \
            --state-file pipeline_state/last_run.jsonl \
            --log-file logs/run.jsonl \
            --mismatch-threshold 0.2 \
            || echo "::warning::Loto ingest failed; dashboard will show last known data"

      - name: Ingest Kino pozos (dry data for the dashboard)
        id: ingest-kino
        continue-on-error: true
        run: |
          mkdir -p artifacts_kino site
          python -m polla_app run \
            --sources kino \
            --retries 2 \
            --timeout 30 \
            --no-fail-fast \
            --raw-dir artifacts_kino/raw \
            --normalized artifacts_kino/normalized.jsonl \
            --comparison-report artifacts_kino/comparison_report.json \
            --summary artifacts_kino/run_summary.json \
            --state-file pipeline_state/last_run.jsonl \
            --log-file logs/run_kino.jsonl \
            --mismatch-threshold 0.2 \
            || echo "::warning::Kino ingest failed; dashboard will show last known data"

      - name: Generate dashboard data
        run: |
          python -m polla_app site \
            --normalized artifacts/normalized.jsonl \
            --normalized-kino artifacts_kino/normalized.jsonl \
            --summary artifacts/run_summary.json \
            --output site/data.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
